<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mestre - Avaliação e Prescrição Inteligente</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./css/main.css">

    <!-- External Libraries -->
    <!-- Chart.js for graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- jsPDF for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>
<body>
    <div id="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                MESTRE
                <div style="font-size: 0.75rem; font-weight: normal; color: var(--text-light)">Personal Trainer OS</div>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="#/dashboard" class="active">Dashboard</a></li>
                    <li><a href="#/alunos">Alunos</a></li>
                    <li><a href="#/treinos">Treinos</a></li>
                    <li><a href="#/configuracoes">Configurações</a></li>
                    <li><a href="#/backup">Backup & Dados</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header no-print">
                <button class="menu-toggle" id="menu-toggle">☰</button>
                <div class="header-user" id="header-user-name">
                    Profissional
                </div>
            </header>

            <!-- Where views are injected -->
            <div class="page-content" id="router-view">
                <!-- App content renders here -->
            </div>
        </main>
    </div>

    <!-- Modals & Overlay Containers -->
    <div id="toast-container"></div>

    <!-- Scripts -->
    <!-- Use type="module" to enable ES6 modules -->
    <script type="module" src="./js/app.js"></script>
    <script>
        // Simple sidebar toggle for mobile
        document.getElementById('menu-toggle').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('open');
        });
    </script>
</body>
</html>
